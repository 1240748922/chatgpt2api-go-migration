worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    sendfile on;
    gzip on;
    gzip_types application/json text/css application/javascript;
    client_max_body_size 128m;
    upstream go_admin {
        zone go_admin 64k;
        server app:80 resolve;
        keepalive 32;
    }
    upstream go_images {
        zone go_images 128k;
        least_conn;
        server app:80 resolve;
        keepalive 64;
    }
    server {
        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # No trailing slash: preserve the complete /api/ route.
        location /api/ { proxy_pass http://go_admin; }
        # Never replay a submitted generation on a different worker.
        location /v1/ { proxy_next_upstream off; proxy_pass http://go_images; }
        location / { proxy_pass http://go_admin; }
    }
}
