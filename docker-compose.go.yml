name: chatgpt-images-go

x-app: &app
  image: ${CHATGPT_GO_IMAGE:-chatgpt-images-go:local}
  build:
    context: .
    dockerfile: Dockerfile.golang
    target: app-runtime
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    volume-init:
      condition: service_completed_successfully
  volumes:
    - go-data:/app/data
    - go-logs:/app/logs
  environment: &app-env
    GO_DATABASE_URL: postgres://chatgpt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.go}@postgres:5432/chatgpt?sslmode=disable
    CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?set API key in .env.go}
    CHATGPT2API_ADMIN_KEY: ${CHATGPT2API_ADMIN_KEY:?set admin key in .env.go}
    GO_OAUTH_ENCRYPTION_KEY: ${GO_OAUTH_ENCRYPTION_KEY:?set a stable encryption key in .env.go}
    GO_LISTEN_ADDR: :80
    GO_CONFIG_PATH: /app/data/config.json
    GO_ACCOUNTS_PATH: /app/data/accounts.json
    GO_AUTH_KEYS_PATH: /app/data/auth_keys.json
    GROK_DATA_DIR: /app/data
    GO_QUEUE_BACKEND: json
    GO_PUBLIC_BASE_URL: ${GO_PUBLIC_BASE_URL:-}
    GO_IMAGE_ACCOUNT_CONCURRENCY: ${GO_IMAGE_ACCOUNT_CONCURRENCY:-1}
    GO_IMAGE_MAX_CONCURRENCY: ${GO_IMAGE_MAX_CONCURRENCY:-128}
    GO_REQUEST_TIMEOUT_SECONDS: ${GO_REQUEST_TIMEOUT_SECONDS:-180}
    GO_DATABASE_MAX_CONNECTIONS: ${GO_DATABASE_MAX_CONNECTIONS:-8}
    GO_REGISTRATION_WORKER: "false"
    GO_IMAGE_PROCESSOR_URL: http://image-processor:8080
    TZ: ${TZ:-Asia/Shanghai}
  healthcheck:
    test: [CMD, wget, -qO-, http://127.0.0.1/health]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  image-processor:
    image: ${CHATGPT_GO_PROCESSOR_IMAGE:-chatgpt-images-go-processor:local}
    build:
      context: .
      dockerfile: image-processor/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 1g
    environment:
      IMAGE_PROCESSOR_CONCURRENCY: ${IMAGE_PROCESSOR_CONCURRENCY:-2}
  volume-init:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    command: [sh, -c, "mkdir -p /data/files /data/registration /logs && chown -R 10001:10001 /data /logs"]
    volumes:
      - go-data:/data
      - go-logs:/logs
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatgpt
      POSTGRES_DB: chatgpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.go}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - go-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chatgpt -d chatgpt"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Keep one application service by default. Compose can add replicas without
  # changing the gateway or the shared PostgreSQL-backed account state:
  #   docker compose --env-file .env.go -f docker-compose.go.yml up -d --scale app=4
  app: *app
  registrar:
    <<: *app
    image: ${CHATGPT_GO_REGISTRAR_IMAGE:-chatgpt-images-go-registrar:local}
    build:
      context: .
      dockerfile: Dockerfile.golang
      target: registrar
    environment:
      <<: *app-env
      GO_REGISTRATION_WORKER: "true"
      GO_REGISTRATION_TOOL_DIR: /app/registration-tool
      GO_REGISTRATION_RUNTIME_DIR: /app/data/registration
    shm_size: 1gb
    healthcheck:
      test: [CMD, curl, --fail, --max-time, "5", http://127.0.0.1/health]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CHATGPT_GO_PORT:-31001}:80"
    volumes:
      - ./deploy/go-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  go-data:
  go-logs:
  go-postgres:
